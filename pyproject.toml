[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-notary"
version = "0.1.0"
license = "MIT"
description = "Publish selected Obsidian notes to IPFS with provenance on NEAR"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.27", "click>=8.1", "python-dotenv>=1.0", "near-kit>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vault-notary = "vault_notary.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
